name: test action

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        version: [stable, pre-release, bleeding]
        os: [ubuntu-latest, macos-latest, windows-latest]

      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: test action
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: moon version
        run: moon version --all
