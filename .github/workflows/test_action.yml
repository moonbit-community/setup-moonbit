name: Test Action

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        version:
          - latest
          - nightly
          - pre-release
        include:
          - os: ubuntu-latest
            version: stable
          - os: ubuntu-latest
            version: bleeding

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Moonbit
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Verify Moonbit install (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          command -v moon
          moon version --all
          moon_home="${MOON_HOME:-$HOME/.moon}"
          test -x "$moon_home/bin/moon"

      - name: Verify Moonbit install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command moon -ErrorAction SilentlyContinue)) {
            throw "moon is not on PATH"
          }
          moon version --all
          $moonHome = if ($env:MOON_HOME) { $env:MOON_HOME } else { "$env:USERPROFILE\.moon" }
          if (-not (Test-Path -Path "$moonHome\bin\moon.exe")) {
            throw "moon.exe not found in $moonHome\bin"
          }
