name: Setup Moonbit
description: Install and configure the Moonbit toolchain
author: moonbit-community

branding:
  icon: heart
  color: red

inputs:
  version:
    description: moonbit version (latest|nightly|pre-release; stable->latest, bleeding->nightly)
    required: false
    default: "latest"

runs:
  using: composite
  steps:
    - name: Resolve inputs (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if command -v python3 >/dev/null 2>&1; then
          python3 "$GITHUB_ACTION_PATH/scripts/resolve.py"
        else
          python "$GITHUB_ACTION_PATH/scripts/resolve.py"
        fi

    - name: Resolve inputs (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        $script = Join-Path $env:GITHUB_ACTION_PATH "scripts/resolve.py"
        python $script

    - name: Install Moonbit (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        MOON_HOME: ${{ env.MOONBIT_MOON_HOME }}
      run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- ${{ env.MOONBIT_RESOLVED_VERSION }}

    - name: Install Moonbit (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $env:MOONBIT_INSTALL_VERSION = "${{ env.MOONBIT_RESOLVED_VERSION }}"
        $env:MOON_HOME = "${{ env.MOONBIT_MOON_HOME }}"
        Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -ErrorAction SilentlyContinue
        irm https://cli.moonbitlang.com/install/powershell.ps1 | iex

    - name: Add to PATH (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: echo "${{ env.MOONBIT_MOON_BIN }}" >> $GITHUB_PATH

    - name: Add to PATH (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Add-Content -Path $env:GITHUB_PATH -Value "${{ env.MOONBIT_MOON_BIN }}" -Encoding utf8

    - name: Update Moonbit (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: moon update

    - name: Update Moonbit (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: moon update
